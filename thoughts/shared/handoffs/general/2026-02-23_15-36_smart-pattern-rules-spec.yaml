questions:
  - Should --dry-run be a separate flag or a verbosity level (-vvv)?
  - Should "Did you mean?" errors be auto-correctable with --auto-fix-patterns?
  - Performance of specificity computation for large directory trees — caching needed?

decisions:
  - standard_glob_semantics: Chose POSIX standard globs over custom recursive-by-default. Familiar to all CLI users, avoids breaking expectations. Pre-mortem tiger identified non-standard globs as high risk.
  - smart_anchoring: "./" prefix = exact path from root; bare pattern = suffix match at any depth. Less specified = broader search.
  - strict_file_folder_discrimination: Trailing slash = folder, no slash = file. Strict with helpful "Did you mean?" errors.
  - specificity_precedence: When -i and -x conflict, most specific pattern wins (8-level ranking). Equal rank = -x wins.
  - default_ignores_always_apply: -i does NOT override default ignores. Warning emitted when conflict detected.
  - multiple_includes_are_OR: Each -i adds to result set. AND expressed via path composition (e.g., tests/**/*.py).
  - dry_run_flag: Add --dry-run/--explain to show pattern resolution transparently.

findings:
  - pattern_rules_table: 7 rules covering anchoring, type discrimination, wildcards, OR semantics, exclusion symmetry, specificity precedence, and default ignore behavior
  - current_patterns_py_uses_fnmatch: dirdigest/utils/patterns.py:8-51 — complete rewrite needed for new rules
  - core_py_no_specificity: dirdigest/core.py:95-101 — currently simple pattern check, needs specificity-based conflict resolution
  - test_output_formatting_duplicate: tests/test_output_formatting.py and tests/test_cli_sorting_and_logging.py are near-identical — cleanup opportunity

