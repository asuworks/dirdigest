decisions:
  - parallel_agent_strategy: Used 3 parallel worktree agents (kraken x2 + spark) for Phase 1, then arbiter for test fixes. Merged by adapting APIs to Phase 1A's authoritative patterns.py.
  - default_ignores_separate: Default ignore patterns checked independently before specificity resolution. They always win unless --no-default-ignore.
  - dir_pruning_with_overrides: Directories excluded by -x are NOT pruned from os.walk if any include pattern has higher specificity (lower rank number). This allows tests/test_main.py to override -x tests/. See core.py:282-298.
  - backward_compat_wrappers: matches_pattern() and matches_patterns() wrappers preserved for DEFAULT_IGNORE_PATTERNS checking. New code uses ParsedPattern API directly.

findings:
  - api_mismatch_in_parallel: Three parallel agents each created incompatible pattern APIs (different attribute names, swapped arg order). Main context had to reconcile during merge. Define contracts MORE precisely in Phase 0 next time.
  - dir_pruning_critical_bug: os.walk prunes excluded dirs, preventing files inside from being evaluated. Two bugs found — file-only includes pruning all dirs (arbiter fix at core.py:80-83), and excluded dirs not traversed for override includes (core.py:282-298).
  - star_py_root_only: "*.py" matches root-level only per POSIX spec. Tests using --include *.py expecting recursive had to change to --include **/*.py.

