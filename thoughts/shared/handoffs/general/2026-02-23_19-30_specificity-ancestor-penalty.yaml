questions:
  - Does the ancestor penalty interact correctly with ALL 7 spec rules? Needs systematic verification.
  - Should anchored multi-segment folder patterns (./a/b/) get ancestor penalty for ./a/b/c? Currently yes — verify this is desired.
  - Edge case — what happens with -i './a/' -x './a/b/' -i './a/b/c/'? Triple nesting with alternating include/exclude.

decisions:
  - ancestor_penalty_dirs_only: Ancestor penalty only applies to directory-vs-directory resolution (is_dir=True). For files, folder exclusions work via os.walk pruning, so no penalty needed. This preserves tests/ excluding tests/test_other.py correctly.
  - direct_vs_containment: For unanchored folder patterns, a match is "direct" if pattern segments align with the LAST segments of the path (suffix match). Otherwise it's ancestor/containment. See patterns.py:is_ancestor_match().
  - explicit_recursive_specificity: **/exact.py now gets rank 6 (same as exact.py), **/folder/ gets rank 7. The **/ prefix means "at any depth" but doesn't reduce pattern specificity. Only wildcards (* ?) reduce to rank 8.
  - traversal_only_not_logged: Directories allowed through os.walk purely for traversal (no direct include match) are no longer logged as "included" in log_events. This fixes both dry-run and standard console output.

findings:
  - ancestor_principle: "When include and exclude conflict, the pattern that most specifically targets that path wins. Direct name > parent containment. Within each level, 8-rank system breaks ties. Ties at same level, exclude wins."
  - pruning_depth_interaction: Directory pruning and ancestor penalty interact — when a dir is excluded but has ancestor penalty on the include, the pruning check (best_include_rank >= best_exclude_rank) uses RAW ranks not penalized ranks. This is correct because pruning is about whether files inside COULD match, not about the dir itself.
  - is_ancestor_match_suffix: For unanchored patterns, checking len(path_parts) > len(segments) is wrong — it flags direct suffix matches as ancestors. Must check if pattern aligns with LAST segments of path. See patterns.py:175-185.

