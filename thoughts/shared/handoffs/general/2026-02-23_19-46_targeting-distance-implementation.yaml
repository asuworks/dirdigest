decisions:
  - targeting_distance_over_ancestor_penalty: "Distance 0 = direct match, N = ancestor depth. File patterns always distance 0 for matched files. Folder patterns distance ≥1 for contained files. This makes file includes beat folder excludes for files, matching user mental model."
  - sentinel_999_not_negative_1: "Non-match returns 999 (sorts last) instead of -1 (would sort first in min()). Safe failure mode per pre-mortem."
  - suffix_match_position_refactor: "Created _suffix_match_folder_position() returning int|None, made _suffix_match_folder() a thin wrapper. Zero behavior change for existing callers."
  - pruning_smart_heuristic: "Don't prune excluded dirs if any file-level include (unanchored/recursive) could match inside. Anchored includes to different subtrees still allow pruning."
  - spec_change_documented: "README and spec updated to clarify that -x 'tests/' only excludes the folder, not files matched by file-level -i patterns. Use -x 'tests/**/*.py' to exclude files by type."

